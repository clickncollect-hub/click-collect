<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>click&collect | Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #f9f3e8 0%, #ffe6d5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 48px 32px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            max-width: 500px;
            width: 100%;
            text-align: center;
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: scale(1.01);
        }
        .logo-container {
            margin-bottom: 24px;
        }
        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.1));
            border-radius: 30px;
            background: white;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #2b2b2b, #5a3e2b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
            text-transform: lowercase;
            word-break: break-word;
        }
        h1::first-letter {
            text-transform: uppercase;
        }
        .tagline {
            font-size: 1.2rem;
            color: #6b4f3a;
            margin-bottom: 40px;
            font-weight: 300;
            background: rgba(255, 235, 220, 0.7);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 100px;
            backdrop-filter: blur(4px);
        }
        .btn {
            display: inline-block;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 18px 48px;
            font-size: 1.4rem;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 12px 20px -12px #2c3e50, 0 4px 12px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-top: 16px;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: #1e2b38;
            transform: translateY(-3px);
            box-shadow: 0 22px 28px -14px #1e2b38, 0 6px 16px rgba(0, 0, 0, 0.15);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 8px 16px -8px #1e2b38;
        }
        .footer-note {
            margin-top: 40px;
            font-size: 1rem;
            color: #7f5e45;
        }
        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #a78972;
        }
        /* fallback if logo.png missing */
        .logo-placeholder {
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #d4af8c, #b88e6a);
            border-radius: 30px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            font-weight: bold;
            box-shadow: 0 8px 14px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Logo: assumes logo.png exists in same folder -->
        <div class="logo-container">
            <img src="logo.png" alt="click&collect logo" class="logo" onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='flex';">
            <!-- Fallback in case logo.png is not found -->
            <div class="logo-placeholder logo-fallback" style="display: none;">C&C</div>
        </div>

        <h1>click&collect</h1>
        <div class="tagline">buy & sell · new & used</div>

        <!-- Button that takes you to the marketplace only when clicked -->
        <a href="https://clickncollect.xo.je/clickcollect/public/" class="btn">🚀 Enter Marketplace</a>

        <div class="footer-note">
            click the button to start shopping or selling
        </div>

        <footer>
            second-hand · local · trusted
        </footer>
    </div>

    <!-- (No automatic redirect, no countdown) -->
</body>
</html>
